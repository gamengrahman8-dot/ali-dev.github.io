<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آلة حاسبة</title>
    <style>
        /* إعدادات عامة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e2f;
        }

        /* حاوية الآلة الحاسبة */
        .calculator {
            background: #2d2d44;
            border-radius: 32px;
            padding: 24px 20px 30px;
            width: 340px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.2s;
        }

        /* شاشة العرض */
        .display {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 20px;
            text-align: left;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            word-break: break-all;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .display .previous {
            color: #a0a0c0;
            font-size: 18px;
            min-height: 28px;
            direction: ltr;
        }

        .display .current {
            color: #ffffff;
            font-size: 38px;
            font-weight: 600;
            min-height: 48px;
            direction: ltr;
        }

        /* شبكة الأزرار */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        /* نمط الأزرار العامة */
        .btn {
            padding: 18px 0;
            font-size: 24px;
            font-weight: 500;
            border: none;
            border-radius: 18px;
            background: #3b3b5a;
            color: #f0f0ff;
            cursor: pointer;
            transition: 0.15s ease;
            box-shadow: 0 4px 0 #1f1f30;
            user-select: none;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* أزرار العمليات */
        .btn.operator {
            background: #f6a84c;
            color: #1e1e2f;
            box-shadow: 0 4px 0 #b87a2e;
        }

        .btn.operator:active {
            background: #e0973a;
        }

        /* زر المسح (C) و (⌫) */
        .btn.clear {
            background: #e45c5c;
            color: #fff;
            box-shadow: 0 4px 0 #a33d3d;
        }

        .btn.clear:active {
            background: #cc4a4a;
        }

        /* زر النسبة المئوية وعلامة ± */
        .btn.function {
            background: #4a4a6a;
            box-shadow: 0 4px 0 #2e2e48;
        }

        /* زر المساواة */
        .btn.equals {
            background: #4c8bf5;
            color: #fff;
            box-shadow: 0 4px 0 #2a5fbf;
        }

        .btn.equals:active {
            background: #3a75d6;
        }

        /* زر الصفر يأخذ عمودين */
        .btn.zero {
            grid-column: span 2;
        }

        /* تحسين المظهر على الشاشات الصغيرة */
        @media (max-width: 400px) {
            .calculator {
                width: 290px;
                padding: 16px 14px 22px;
            }
            .btn {
                padding: 14px 0;
                font-size: 20px;
            }
            .display .current {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- شاشة العرض -->
        <div class="display">
            <div class="previous" id="previousDisplay"></div>
            <div class="current" id="currentDisplay">0</div>
        </div>

        <!-- أزرار الآلة الحاسبة -->
        <div class="buttons">
            <!-- الصف الأول -->
            <button class="btn clear" data-value="clear">C</button>
            <button class="btn function" data-value="backspace">⌫</button>
            <button class="btn function" data-value="percent">%</button>
            <button class="btn operator" data-value="÷">÷</button>

            <!-- الصف الثاني -->
            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn operator" data-value="×">×</button>

            <!-- الصف الثالث -->
            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn operator" data-value="−">−</button>

            <!-- الصف الرابع -->
            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn operator" data-value="+">+</button>

            <!-- الصف الخامس -->
            <button class="btn zero" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn equals" data-value="=">=</button>
        </div>
    </div>

    <script>
        (function() {
            // عناصر العرض
            const previousDisplay = document.getElementById('previousDisplay');
            const currentDisplay = document.getElementById('currentDisplay');

            // متغيرات الحالة
            let currentInput = '0';        // الرقم المعروض حالياً
            let previousInput = '';        // الرقم السابق (قبل العملية)
            let operation = null;           // العملية الحالية (+، −، ×، ÷)
            let shouldResetDisplay = false; // هل نعيد تعيين الشاشة عند إدخال رقم جديد؟

            // تحديث واجهة العرض
            function updateDisplay() {
                currentDisplay.textContent = currentInput;
                previousDisplay.textContent = previousInput ? `${previousInput} ${operation || ''}` : '';
            }

            // إدخال رقم أو نقطة عشرية
            function inputDigit(digit) {
                if (shouldResetDisplay) {
                    currentInput = digit;
                    shouldResetDisplay = false;
                } else {
                    // منع تكرار النقطة العشرية
                    if (digit === '.' && currentInput.includes('.')) return;
                    // منع الأصفار البادئة غير الضرورية
                    if (currentInput === '0' && digit !== '.') {
                        currentInput = digit;
                    } else {
                        currentInput += digit;
                    }
                }
                updateDisplay();
            }

            // معالجة العمليات الحسابية
            function handleOperator(op) {
                const current = parseFloat(currentInput);
                if (operation && !shouldResetDisplay) {
                    // إجراء العملية السابقة إذا كانت موجودة
                    const result = calculate(parseFloat(previousInput), current, operation);
                    currentInput = String(result);
                    previousInput = '';
                    operation = null;
                    shouldResetDisplay = true;
                } else {
                    previousInput = currentInput;
                }
                operation = op;
                shouldResetDisplay = true;
                updateDisplay();
            }

            // دالة الحساب
            function calculate(a, b, op) {
                let result;
                switch (op) {
                    case '+': result = a + b; break;
                    case '−': result = a - b; break;
                    case '×': result = a * b; break;
                    case '÷': result = (b === 0) ? 'خطأ' : a / b; break;
                    default: result = b;
                }
                // تجنب أخطاء الفاصلة العائمة
                if (typeof result === 'number' && !Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(10));
                }
                return result;
            }

            // تنفيذ المساواة (=)
            function evaluate() {
                if (!operation || shouldResetDisplay) {
                    // إذا لم تكن هناك عملية أو تم إعادة التعيين، نعيد ما هو موجود
                    return;
                }
                const current = parseFloat(currentInput);
                const previous = parseFloat(previousInput);
                if (isNaN(previous) || isNaN(current)) return;

                const result = calculate(previous, current, operation);
                currentInput = String(result);
                previousInput = '';
                operation = null;
                shouldResetDisplay = true;
                updateDisplay();
            }

            // مسح الكل (C)
            function clearAll() {
                currentInput = '0';
                previousInput = '';
                operation = null;
                shouldResetDisplay = false;
                updateDisplay();
            }

            // مسح آخر حرف (⌫)
            function backspace() {
                if (shouldResetDisplay) return;
                if (currentInput.length > 1) {
                    currentInput = currentInput.slice(0, -1);
                } else {
                    currentInput = '0';
                }
                updateDisplay();
            }

            // النسبة المئوية (%)
            function percent() {
                const num = parseFloat(currentInput);
                if (isNaN(num)) return;
                const result = num / 100;
                currentInput = String(result);
                updateDisplay();
            }

            // تبديل الإشارة (±) - أضفناها كوظيفة إضافية غير موجودة في الواجهة لكن يمكن تفعيلها
            // لكننا لم نضف زراً لها في التصميم، سنتركها اختيارية.

            // ربط الأحداث بالأزرار
            document.querySelectorAll('.btn').forEach(button => {
                button.addEventListener('click', function(e) {
                    const value = this.dataset.value;

                    // الأرقام و النقطة
                    if (!isNaN(value) || value === '.') {
                        inputDigit(value);
                        return;
                    }

                    // العمليات
                    if (['+', '−', '×', '÷'].includes(value)) {
                        handleOperator(value);
                        return;
                    }

                    // المساواة
                    if (value === '=') {
                        evaluate();
                        return;
                    }

                    // الأوامر الأخرى
                    switch (value) {
                        case 'clear':
                            clearAll();
                            break;
                        case 'backspace':
                            backspace();
                            break;
                        case 'percent':
                            percent();
                            break;
                        default:
                            break;
                    }
                });
            });

            // دعم لوحة المفاتيح (اختياري)
            document.addEventListener('keydown', function(e) {
                const key = e.key;
                if (key >= '0' && key <= '9') {
                    inputDigit(key);
                    e.preventDefault();
                } else if (key === '.') {
                    inputDigit('.');
                    e.preventDefault();
                } else if (key === '+') {
                    handleOperator('+');
                    e.preventDefault();
                } else if (key === '-') {
                    handleOperator('−');
                    e.preventDefault();
                } else if (key === '*') {
                    handleOperator('×');
                    e.preventDefault();
                } else if (key === '/') {
                    handleOperator('÷');
                    e.preventDefault();
                } else if (key === 'Enter' || key === '=') {
                    evaluate();
                    e.preventDefault();
                } else if (key === 'Backspace') {
                    backspace();
                    e.preventDefault();
                } else if (key === 'Escape' || key === 'c' || key === 'C') {
                    clearAll();
                    e.preventDefault();
                } else if (key === '%') {
                    percent();
                    e.preventDefault();
                }
            });

            // بداية التطبيق
            updateDisplay();
        })();
    </script>

</body>
</html>
