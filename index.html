<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محصول جدید ما | فروشگاه آنلاین</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; direction: rtl; }
        header { background: #333; color: white; padding: 1rem; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .product { text-align: center; margin: 2rem 0; }
        .product img { max-width: 100%; height: auto; border-radius: 8px; }
        .cta-button {
            background: #ff6b6b; color: white; padding: 1rem 2rem; border: none;
            border-radius: 4px; font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        .cta-button:hover { background: #ff5252; }
    </style>
</head>
<body>
    <header>
        <h1>محصول شگفت‌انگیز ما</h1>
    </header>
    <div class="container">
        <div class="product">
            <img src="product-image.jpg" alt="محصول ما">
            <h2>توضیحات محصول</h2>
            <p>این محصول فوق‌العاده به شما کمک می‌کند تا در هر زمینه‌ای موفق شوید!</p>
            <button class="cta-button">خرید همین حالا</button>
        </div>
    </div>
</body>
</html>
